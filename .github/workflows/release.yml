name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    env:
      # Passed through the environment so an odd tag name is never spliced into script text.
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      # checkout leaves an annotated tag without its message; fetch it again.
      - name: Fetch the tag annotation
        run: git fetch --force origin "refs/tags/${env:TAG}:refs/tags/${env:TAG}"

      - name: Check the tag matches CMakeLists.txt
        run: |
          $version = [regex]::Match((Get-Content CMakeLists.txt -Raw), '(?m)^project\(ygol_access VERSION (\d+\.\d+\.\d+)').Groups[1].Value
          if ($env:TAG -ne "v$version") {
            throw "Tag $env:TAG does not match the CMakeLists.txt version $version. Delete the tag, fix the version, and tag again."
          }
          "VERSION=$version" >> $env:GITHUB_ENV

      - name: Build, test and package
        run: ./scripts/package_release.ps1

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = "dist/ygol-access-$env:VERSION.zip"
          $notes = Join-Path $env:RUNNER_TEMP 'notes.md'
          $tagNotes = (git tag -l --format='%(contents)' $env:TAG) -join "`n"
          $install = "## Install`n`nClose the game. Unzip, then copy ``xinput9_1_0.dll`` and ``prism.dll`` into the game folder, next to ``YuGiOh.exe`` (in Steam: right-click the game, Manage, Browse local files). To uninstall, delete those two files. README.html in the zip lists the hotkeys and what is read."
          "$tagNotes`n`n$install" | Set-Content $notes -Encoding utf8
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            # A rerun of this job: replace the asset, keep the release.
            gh release upload $env:TAG $zip --clobber
          } else {
            gh release create $env:TAG $zip --title "ygol-access $env:VERSION" --notes-file $notes
          }
          if ($LASTEXITCODE -ne 0) { throw "gh failed" }
